<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" role="img" aria-label="Tejo Hasini's GitHub stats">
<defs><style><![CDATA[
text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
@keyframes fadeSlide { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
@keyframes spinRing { 0% { stroke-dashoffset: 260; } 100% { stroke-dashoffset: 45; } }
@keyframes glowPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
.row { opacity: 0; animation: fadeSlide 0.5s ease forwards; }
.ring { stroke-dasharray: 260; stroke-dashoffset: 260; animation: spinRing 1.6s cubic-bezier(0.2, 0.8, 0.3, 1) 0.3s forwards; }
.gp { animation: glowPulse 3s ease-in-out infinite; }
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#00f5ff;#ff7eb6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#00f5ff;#ff7eb6;#c084fc;#00f5ff" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff7eb6"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#00f5ff"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect x="1" y="1" width="498" height="238" rx="14" fill="#150e26" stroke="url(#tg)" stroke-width="1.6"/>
<rect x="1" y="1" width="498" height="238" rx="14" fill="none" stroke="url(#tg)" stroke-width="3" opacity="0.15" filter="url(#glow)"/>

<!-- Header -->
<text x="24" y="36" font-size="15" font-weight="bold" fill="url(#tg)">🌸 Tejo Hasini&apos;s GitHub Stats</text>

<!-- Rank badge circle on upper right -->
<g transform="translate(440, 32)">
  <circle cx="0" cy="0" r="18" fill="#1e1338" stroke="#382554" stroke-width="2"/>
  <circle class="ring" cx="0" cy="0" r="18" fill="none" stroke="url(#ringg)" stroke-width="2.5" stroke-linecap="round" transform="rotate(-90)"/>
  <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#00f5ff">A+</text>
</g>

<!-- Rows -->
<g class="row" style="animation-delay:0.30s">
  <text x="24" y="74" font-size="13" fill="#e6edf3">📦 Public Repositories</text>
  <text x="476" y="74" text-anchor="end" font-size="13" font-weight="bold" fill="#ff7eb6">19 Repos</text>
</g>
<g class="row" style="animation-delay:0.50s">
  <text x="24" y="110" font-size="13" fill="#e6edf3">🌟 Open Source Track</text>
  <text x="476" y="110" text-anchor="end" font-size="13" font-weight="bold" fill="#c084fc">GSSoC &apos;26 Contributor</text>
</g>
<g class="row" style="animation-delay:0.70s">
  <text x="24" y="146" font-size="13" fill="#e6edf3">🧠 Primary Specialization</text>
  <text x="476" y="146" text-anchor="end" font-size="13" font-weight="bold" fill="#00f5ff">AI / ML &amp; Full-Stack</text>
</g>
<g class="row" style="animation-delay:0.90s">
  <text x="24" y="182" font-size="13" fill="#e6edf3">🎓 Core Technologies</text>
  <text x="476" y="182" text-anchor="end" font-size="13" font-weight="bold" fill="#e879f9">TypeScript &amp; Python</text>
</g>
<g class="row" style="animation-delay:1.10s">
  <text x="24" y="216" font-size="13" fill="#e6edf3">🔥 Contribution Status</text>
  <text x="476" y="216" text-anchor="end" font-size="13" font-weight="bold" fill="#4ade80">Active &amp; Building 🚀</text>
</g>
</svg>