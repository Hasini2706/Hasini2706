<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 680" width="100%" height="100%">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#080314" />
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="cardShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <clipPath id="avatarClip">
      <circle cx="160" cy="180" r="70" />
    </clipPath>
  </defs>

  <style>
    @keyframes swing {
      0% { transform: rotate(-3.5deg); }
      50% { transform: rotate(3.5deg); }
      100% { transform: rotate(-3.5deg); }
    }

    @keyframes shine {
      0% { transform: translateX(-300px) translateY(-300px) rotate(45deg); }
      30%, 100% { transform: translateX(500px) translateY(500px) rotate(45deg); }
    }

    .swinging-group {
      transform-origin: 220px 0px;
      animation: swing 6s ease-in-out infinite;
    }

    .shine-effect {
      animation: shine 7s infinite;
    }
  </style>

  <path d="M 170 -20 L 210 100 L 215 100 L 175 -20 Z" fill="url(#strapGrad)" />
  <path d="M 270 -20 L 230 100 L 225 100 L 265 -20 Z" fill="url(#strapGrad)" />

  <g class="swinging-group">
    <circle cx="220" cy="105" r="14" fill="none" stroke="#e2e8f0" stroke-width="4" />
    <rect x="212" y="118" width="16" height="24" rx="4" fill="#94a3b8" />
    <path d="M 215 142 L 225 142 L 220 155 Z" fill="#64748b" />

    <g transform="translate(60, 155)" filter="url(#cardShadow)">
      <rect width="320" height="490" rx="20" fill="url(#cardGrad)" stroke="url(#strapGrad)" stroke-width="2.5" />
      <rect x="130" y="12" width="60" height="10" rx="5" fill="#080314" stroke="#475569" stroke-width="1.5" />

      <text x="160" y="55" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#00f5ff" text-anchor="middle" letter-spacing="2">PASSPORT • GSSOC '26</text>

      <circle cx="160" cy="180" r="76" fill="none" stroke="#ff2a85" stroke-width="3" stroke-dasharray="8 4" />
      <circle cx="160" cy="180" r="71" fill="#0f0728" />

      <g clip-path="url(#avatarClip)">
        <image href="https://raw.githubusercontent.com/Hasini2706/Hasini2706/main/assets/hasini-character.png" x="60" y="80" width="200" height="200" preserveAspectRatio="xMidYMid slice" />
      </g>

      <text x="160" y="290" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1">TEJO HASINI</text>
      <text x="160" y="315" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#ff2a85" text-anchor="middle" letter-spacing="2">AI / ML DEVELOPER</text>
      <text x="160" y="338" font-family="'Fira Code', monospace" font-size="13" fill="#00f5ff" text-anchor="middle">@Hasini2706</text>

      <line x1="40" y1="360" x2="280" y2="360" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

      <g transform="translate(40, 380)">
        <rect width="115" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
        <circle cx="18" cy="13" r="4" fill="#10b981" />
        <text x="30" y="17" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#10b981">VERIFIED DEV</text>
      </g>

      <g transform="translate(165, 380)">
        <rect width="115" height="26" rx="13" fill="rgba(255, 42, 133, 0.15)" stroke="#ff2a85" stroke-width="1" />
        <text x="57.5" y="17" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#ff2a85" text-anchor="middle">GSSoC '26</text>
      </g>

      <g transform="translate(40, 425)" fill="#ffffff" opacity="0.75">
        <rect x="0" y="0" width="3" height="35" /><rect x="6" y="0" width="1" height="35" />
        <rect x="10" y="0" width="4" height="35" /><rect x="17" y="0" width="2" height="35" />
        <rect x="22" y="0" width="1" height="35" /><rect x="26" y="0" width="5" height="35" />
        <rect x="34" y="0" width="2" height="35" /><rect x="39" y="0" width="3" height="35" />
        <rect x="45" y="0" width="1" height="35" /><rect x="49" y="0" width="4" height="35" />
        <rect x="56" y="0" width="2" height="35" /><rect x="61" y="0" width="6" height="35" />
        <rect x="70" y="0" width="1" height="35" /><rect x="74" y="0" width="3" height="35" />
        <rect x="80" y="0" width="4" height="35" /><rect x="87" y="0" width="2" height="35" />
        <rect x="92" y="0" width="1" height="35" /><rect x="96" y="0" width="5" height="35" />
        <rect x="104" y="0" width="3" height="35" /><rect x="110" y="0" width="1" height="35" />
        <rect x="114" y="0" width="4" height="35" /><rect x="121" y="0" width="2" height="35" />
        <rect x="126" y="0" width="5" height="35" /><rect x="134" y="0" width="1" height="35" />
        <rect x="138" y="0" width="3" height="35" /><rect x="144" y="0" width="4" height="35" />
        <rect x="151" y="0" width="2" height="35" /><rect x="156" y="0" width="1" height="35" />
        <rect x="160" y="0" width="5" height="35" /><rect x="168" y="0" width="2" height="35" />
        <rect x="173" y="0" width="3" height="35" /><rect x="179" y="0" width="1" height="35" />
        <rect x="183" y="0" width="4" height="35" /><rect x="190" y="0" width="2" height="35" />
        <rect x="195" y="0" width="5" height="35" /><rect x="203" y="0" width="1" height="35" />
        <rect x="207" y="0" width="3" height="35" /><rect x="213" y="0" width="4" height="35" />
        <rect x="220" y="0" width="2" height="35" /><rect x="225" y="0" width="1" height="35" />
        <rect x="229" y="0" width="5" height="35" /><rect x="237" y="0" width="3" height="35" />
      </g>

      <rect class="shine-effect" width="120" height="600" fill="url(#shineGrad)" pointer-events="none" />
    </g>
  </g>
</svg>