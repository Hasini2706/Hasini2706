<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradLight" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
    <radialGradient id="pinkGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nameGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="subtleShadowLight">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <clipPath id="charClipLight">
      <rect x="800" y="80" width="420" height="580" rx="24" />
    </clipPath>
  </defs>

  <style>
    .title-text-light { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 52px; letter-spacing: 2px; }
    .mono-light { font-family: 'Fira Code', 'Courier New', monospace; }
    .role-text-light { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 3px; fill: #0284c7; }
    .tagline-light { font-family: 'Segoe UI', system-ui, sans-serif; font-style: italic; font-size: 16px; fill: #334155; }
    .pill-bg-light { fill: #ffffff; stroke: rgba(217, 70, 239, 0.35); stroke-width: 1.5; rx: 14px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
    .pill-text-light { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 13px; fill: #0f172a; text-anchor: middle; }
  </style>

  <rect width="1280" height="740" fill="url(#bgGradLight)" />
  <circle cx="200" cy="200" r="350" fill="url(#pinkGlowLight)" />

  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="660" height="580" rx="20" fill="#ffffff" stroke="url(#cardBorderLight)" stroke-width="2" filter="url(#subtleShadowLight)" />
    
    <circle cx="30" cy="30" r="6" fill="#ef4444" />
    <circle cx="50" cy="30" r="6" fill="#f59e0b" />
    <circle cx="70" cy="30" r="6" fill="#10b981" />
    <text x="100" y="34" class="mono-light" font-size="13" fill="#64748b">user@hasini-dev:~ (zsh)</text>

    <g transform="translate(30, 75)">
      <text class="mono-light" font-size="14" fill="#d946ef">&gt; user@github:~$ <tspan fill="#334155">cat profile.json</tspan></text>
      
      <g transform="translate(0, 50)">
        <text class="title-text-light" fill="url(#nameGradLight)">TEJO HASINI</text>
      </g>

      <g transform="translate(0, 95)">
        <text class="role-text-light">⚡ AI / ML DEVELOPER</text>
      </g>

      <g transform="translate(0, 130)">
        <text class="tagline-light">"Code. Learn. Build. Contribute. Repeat."</text>
      </g>

      <line x1="0" y1="155" x2="600" y2="155" stroke="#e2e8f0" stroke-width="1" />

      <g transform="translate(0, 185)">
        <g transform="translate(0, 0)"><rect width="90" height="28" class="pill-bg-light" /><text x="45" y="18" class="pill-text-light">Python</text></g>
        <g transform="translate(100, 0)"><rect width="70" height="28" class="pill-bg-light" /><text x="35" y="18" class="pill-text-light">C++</text></g>
        <g transform="translate(180, 0)"><rect width="105" height="28" class="pill-bg-light" /><text x="52.5" y="18" class="pill-text-light">JavaScript</text></g>
        <g transform="translate(295, 0)"><rect width="105" height="28" class="pill-bg-light" /><text x="52.5" y="18" class="pill-text-light">TypeScript</text></g>
        <g transform="translate(410, 0)"><rect width="75" height="28" class="pill-bg-light" /><text x="37.5" y="18" class="pill-text-light">React</text></g>
        <g transform="translate(495, 0)"><rect width="65" height="28" class="pill-bg-light" /><text x="32.5" y="18" class="pill-text-light">SQL</text></g>
        <g transform="translate(0, 38)"><rect width="145" height="28" class="pill-bg-light" /><text x="72.5" y="18" class="pill-text-light">Machine Learning</text></g>
        <g transform="translate(155, 38)"><rect width="125" height="28" class="pill-bg-light" /><text x="62.5" y="18" class="pill-text-light">Generative AI</text></g>
        <g transform="translate(290, 38)"><rect width="115" height="28" class="pill-bg-light" /><text x="57.5" y="18" class="pill-text-light">Data Science</text></g>
        <g transform="translate(415, 38)"><rect width="90" height="28" class="pill-bg-light" /><text x="45" y="18" class="pill-text-light">Power BI</text></g>
      </g>

      <g transform="translate(0, 275)">
        <rect width="600" height="155" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <g transform="translate(20, 25)" class="mono-light" font-size="13">
          <text y="0" fill="#d946ef">function <tspan fill="#0284c7">buildDreams</tspan><tspan fill="#0f172a">() {</tspan></text>
          <text y="24" fill="#7c3aed" x="20">learn<tspan fill="#0f172a">();</tspan></text>
          <text y="48" fill="#7c3aed" x="20">build<tspan fill="#0f172a">();</tspan></text>
          <text y="72" fill="#7c3aed" x="20">contribute<tspan fill="#0f172a">();</tspan></text>
          <text y="96" fill="#d946ef" x="20">repeat<tspan fill="#0f172a">();</tspan></text>
        </g>
      </g>

      <g transform="translate(420, 460)">
        <rect width="180" height="30" rx="8" fill="rgba(217, 70, 239, 0.1)" stroke="#d946ef" stroke-width="1.5" />
        <text x="90" y="20" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#d946ef" text-anchor="middle">KEEP CODING ✨</text>
      </g>
    </g>
  </g>

  <g transform="translate(800, 80)" filter="url(#subtleShadowLight)">
    <rect width="400" height="580" rx="20" fill="#ffffff" stroke="url(#cardBorderLight)" stroke-width="2" />
    <g clip-path="url(#charClipLight)">
      <image href="https://raw.githubusercontent.com/Hasini2706/Hasini2706/main/assets/hasini-character.png" x="780" y="60" width="440" height="620" preserveAspectRatio="xMidYMid slice" />
    </g>
  </g>
</svg>