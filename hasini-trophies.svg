<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 168" width="1092" height="168" role="img" aria-label="Developer Highlights">
<defs><style><![CDATA[
text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
@keyframes popCell { 0% { opacity: 0; transform: translateY(16px) scale(0.85); } 70% { opacity: 1; transform: translateY(-3px) scale(1.03); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes shineSweep { 0% { transform: translateX(-180px) skewX(-20deg); } 60%, 100% { transform: translateX(200px) skewX(-20deg); } }
.cell { opacity: 0; animation: popCell 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.2) forwards; transform-box: fill-box; transform-origin: center; }
.shine { animation: shineSweep 4s ease-in-out infinite; }
]]></style>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.12"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<clipPath id="cellClip"><rect x="0" y="0" width="168" height="144" rx="14"/></clipPath>
</defs>

<!-- Cell 1 -->
<g class="cell" style="animation-delay:0.20s" transform="translate(12, 12)">
  <rect x="0" y="0" width="168" height="144" rx="14" fill="#160e28" stroke="#ff7eb6" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="84" y="48" text-anchor="middle" font-size="30">🏆</text>
  <text x="84" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ff7eb6">GSSoC &apos;26</text>
  <text x="84" y="108" text-anchor="middle" font-size="11" fill="#9aa4b2">Contributor</text>
  <g clip-path="url(#cellClip)"><rect class="shine" x="0" y="0" width="80" height="144" fill="url(#shineg)" style="animation-delay:0.2s"/></g>
</g>

