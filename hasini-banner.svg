<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#140a28" />
      <stop offset="50%" stop-color="#0a0518" />
      <stop offset="100%" stop-color="#03010a" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7209b7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7209b7" stroke-width="1" stroke-opacity="0.12" />
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <clipPath id="charClip">
      <rect x="800" y="80" width="420" height="580" rx="24" />
    </clipPath>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 52px; letter-spacing: 2px; }
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .role-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 3px; fill: #00f5ff; }
    .tagline { font-family: 'Segoe UI', system-ui, sans-serif; font-style: italic; font-size: 16px; fill: #e2e8f0; opacity: 0.85; }
    .pill-bg { fill: rgba(30, 15, 55, 0.6); stroke: rgba(255, 42, 133, 0.4); stroke-width: 1.5; rx: 14px; }
    .pill-text { font-family: 'Segoe UI', sans-serif; font-weight: 600; font-size: 13px; fill: #f8fafc; text-anchor: middle; }
    
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(580px); opacity: 0; }
    }
    .scanner-line { animation: scan 4s ease-in-out infinite; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    .pulsing-bg { animation: pulseGlow 6s ease-in-out infinite; }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; }

    @keyframes roleCycle {
      0%, 20% { opacity: 0; transform: translateY(10px); }
      25%, 45% { opacity: 1; transform: translateY(0px); }
      50%, 70% { opacity: 0; transform: translateY(-10px); }
      75%, 95% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; transform: translateY(10px); }
    }

    .role-1 { animation: roleCycle 12s infinite 0s; }
    .role-2 { animation: roleCycle 12s infinite 3s; }
    .role-3 { animation: roleCycle 12s infinite 6s; }
    .role-4 { animation: roleCycle 12s infinite 9s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .floating { animation: float 5s ease-in-out infinite; }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.4; }
      94% { opacity: 1; }
      97% { opacity: 0.2; }
      98% { opacity: 1; }
    }
    .flicker { animation: flicker 7s infinite; }
  </style>

  <rect width="1280" height="740" fill="url(#bgGrad)" />
  <rect width="1280" height="740" fill="url(#grid)" />
  
  <circle cx="200" cy="200" r="300" fill="url(#pinkGlow)" class="pulsing-bg" />
  <circle cx="1000" cy="400" r="350" fill="url(#cyanGlow)" class="pulsing-bg" />

  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="660" height="580" rx="20" fill="rgba(13, 8, 28, 0.65)" stroke="url(#cardBorder)" stroke-width="2" filter="url(#subtleShadow)" />
    
    <circle cx="30" cy="30" r="6" fill="#ef4444" />
    <circle cx="50" cy="30" r="6" fill="#f59e0b" />
    <circle cx="70" cy="30" r="6" fill="#10b981" />
    <text x="100" y="34" class="mono" font-size="13" fill="#64748b">user@hasini-dev:~ (zsh)</text>

    <g transform="translate(30, 75)">
      <text class="mono" font-size="14" fill="#ff2a85">&gt; user@github:~$ <tspan fill="#e2e8f0">cat profile.json</tspan></text>
      
      <g transform="translate(0, 50)">
        <text class="title-text" fill="url(#nameGrad)" filter="url(#neonGlow)">TEJO HASINI</text>
      </g>

      <g transform="translate(0, 95)">
        <text class="role-text role-1">⚡ AI / ML DEVELOPER</text>
        <text class="role-text role-2">🧠 MACHINE LEARNING ENTHUSIAST</text>
        <text class="role-text role-3">✨ GENERATIVE AI BUILDER</text>
        <text class="role-text role-4">🌐 OPEN SOURCE CONTRIBUTOR</text>
      </g>

      <g transform="translate(0, 130)">
        <text class="tagline">"Code. Learn. Build. Contribute. Repeat."</text>
      </g>

      <line x1="0" y1="155" x2="600" y2="155" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

      <g transform="translate(0, 185)">
        <g transform="translate(0, 0)"><rect width="90" height="28" class="pill-bg" /><text x="45" y="18" class="pill-text">Python</text></g>
        <g transform="translate(100, 0)"><rect width="70" height="28" class="pill-bg" /><text x="35" y="18" class="pill-text">C++</text></g>
        <g transform="translate(180, 0)"><rect width="105" height="28" class="pill-bg" /><text x="52.5" y="18" class="pill-text">JavaScript</text></g>
        <g transform="translate(295, 0)"><rect width="105" height="28" class="pill-bg" /><text x="52.5" y="18" class="pill-text">TypeScript</text></g>
        <g transform="translate(410, 0)"><rect width="75" height="28" class="pill-bg" /><text x="37.5" y="18" class="pill-text">React</text></g>
        <g transform="translate(495, 0)"><rect width="65" height="28" class="pill-bg" /><text x="32.5" y="18" class="pill-text">SQL</text></g>
        <g transform="translate(0, 38)"><rect width="145" height="28" class="pill-bg" /><text x="72.5" y="18" class="pill-text">Machine Learning</text></g>
        <g transform="translate(155, 38)"><rect width="125" height="28" class="pill-bg" /><text x="62.5" y="18" class="pill-text">Generative AI</text></g>
        <g transform="translate(290, 38)"><rect width="115" height="28" class="pill-bg" /><text x="57.5" y="18" class="pill-text">Data Science</text></g>
        <g transform="translate(415, 38)"><rect width="90" height="28" class="pill-bg" /><text x="45" y="18" class="pill-text">Power BI</text></g>
      </g>

      <g transform="translate(0, 275)">
        <rect width="600" height="155" rx="14" fill="rgba(10, 5, 20, 0.75)" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1" />
        <g transform="translate(20, 25)" class="mono" font-size="13">
          <text y="0" fill="#ff2a85">function <tspan fill="#00f5ff">buildDreams</tspan><tspan fill="#e2e8f0">() {</tspan></text>
          <text y="24" fill="#a78bfa" x="20">learn<tspan fill="#e2e8f0">();</tspan></text>
          <text y="48" fill="#a78bfa" x="20">build<tspan fill="#e2e8f0">();</tspan></text>
          <text y="72" fill="#a78bfa" x="20">contribute<tspan fill="#e2e8f0">();</tspan></text>
          <text y="96" fill="#ff2a85" x="20">repeat<tspan fill="#e2e8f0">();</tspan></text>
          <text y="120" fill="#e2e8f0">  <tspan class="cursor" fill="#00f5ff">|</tspan></text>
        </g>
      </g>

      <g transform="translate(420, 460)" class="flicker">
        <rect width="180" height="30" rx="8" fill="rgba(255, 42, 133, 0.15)" stroke="#ff2a85" stroke-width="1.5" />
        <text x="90" y="20" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11" fill="#ff2a85" text-anchor="middle" letter-spacing="1">KEEP CODING ✨</text>
      </g>
    </g>
  </g>

  <g transform="translate(800, 80)" filter="url(#subtleShadow)">
    <rect width="400" height="580" rx="20" fill="rgba(15, 10, 32, 0.5)" stroke="url(#cardBorder)" stroke-width="2" />
    <g clip-path="url(#charClip)">
      <image href="https://raw.githubusercontent.com/Hasini2706/Hasini2706/main/assets/hasini-character.png" x="780" y="60" width="440" height="620" preserveAspectRatio="xMidYMid slice" />
      <rect x="780" y="60" width="440" height="620" fill="url(#cyanGlow)" opacity="0.2" />
      <rect class="scanner-line" x="780" y="60" width="440" height="8" fill="url(#scanlineGrad)" />
    </g>

    <ellipse cx="200" cy="540" rx="160" ry="25" fill="none" stroke="#00f5ff" stroke-width="2" stroke-dasharray="10 5" opacity="0.7" />
    <ellipse cx="200" cy="540" rx="120" ry="18" fill="none" stroke="#ff2a85" stroke-width="1.5" opacity="0.8" />

    <circle cx="60" cy="120" r="4" fill="#00f5ff" class="floating" />
    <circle cx="340" cy="180" r="6" fill="#ff2a85" class="floating" />
    <circle cx="80" cy="420" r="5" fill="#a78bfa" class="floating" />

    <g transform="translate(100, 525)">
      <rect width="200" height="32" rx="16" fill="rgba(10, 5, 25, 0.85)" stroke="#00f5ff" stroke-width="1.5" />
      <circle cx="20" cy="16" r="5" fill="#10b981" />
      <text x="35" y="21" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#00f5ff" letter-spacing="1">SYSTEM ONLINE</text>
    </g>
  </g>
</svg>